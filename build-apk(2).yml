private data class HistoryItem(
    val expression: String,
    val result: String,
    val time: String
)

private class CalculatorStore(context: Context) {

    private val prefs =
        context.getSharedPreferences("blue_black_calculator", Context.MODE_PRIVATE)

    fun saveHistory(items: List<HistoryItem>) {
        val value = items.joinToString("|||") {
            "${it.expression}@@@${it.result}@@@${it.time}"
        }
        prefs.edit().putString("history", value).apply()
    }

    fun loadHistory(): List<HistoryItem> {
        val value = prefs.getString("history", "") ?: ""
        if (value.isBlank()) return emptyList()

        return value.split("|||").mapNotNull {
            val p = it.split("@@@")
            if (p.size == 3) {
                HistoryItem(p[0], p[1], p[2])
            } else null
        }
    }

    fun clearHistory() {
        prefs.edit().remove("history").apply()
    }

    fun saveDarkMode(value: Boolean) {
        prefs.edit().putBoolean("dark", value).apply()
    }

    fun darkMode(): Boolean =
        prefs.getBoolean("dark", true)

    fun saveWallpaper(uri: String?) {
        prefs.edit().putString("wallpaper", uri).apply()
    }

    fun wallpaper(): String? =
        prefs.getString("wallpaper", null)
}

// ============================================================
// EXPRESSION ENGINE
// ============================================================

private class ExpressionParser(
    private val input: String
) {

    private var position = 0

    fun parse(): Double {
        position = 0
        val result = expression()
        skipSpaces()
        if (position < input.length) {
            throw IllegalArgumentException("Invalid expression")
        }
        return result
    }

    private fun expression(): Double {
        var result = term()

        while (true) {
            skipSpaces()

            if (match('+')) {
                result += term()
            } else if (match('-')) {
                result -= term()
            } else {
                break
            }
        }

        return result
    }

    private fun term(): Double {
        var result = power()

        while (true) {
            skipSpaces()

            if (match('*')) {
                result *= power()
            } else if (match('/')) {
                val divisor = power()
                if (divisor == 0.0) throw ArithmeticException("Cannot divide by zero")
                result /= divisor
            } else if (match('%')) {
                result %= power()
            } else {
                break
            }
        }

        return result
    }

    private fun power(): Double {
        var result = unary()

        skipSpaces()

        if (match('^')) {
            result = result.pow(power())
        }

        return result
    }

    private fun unary(): Double {
        skipSpaces()

        if (match('+')) return unary()
        if (match('-')) return -unary()

        return primary()
    }

    private fun primary(): Double {

        skipSpaces()

        if (match('(')) {
            val result = expression()
            if (!match(')')) {
                throw IllegalArgumentException("Missing )")
            }
            return result
        }

        if (position >= input.length) {
            throw IllegalArgumentException("Unexpected end")
        }

        if (input[position].isDigit() || input[position] == '.') {
            return number()
        }

        if (input[position].isLetter()) {
            val name = identifier()

            return when (name.lowercase()) {

                "pi" -> Math.PI

                "e" -> Math.E

                "sqrt" -> {
                    requireOpen()
                    sqrt(expression()).also {
                        requireClose()
                    }
                }

                "sin" -> {
                    requireOpen()
                    sin(Math.toRadians(expression())).also {
                        requireClose()
                    }
                }

                "cos" -> {
                    requireOpen()
                    cos(Math.toRadians(expression())).also {
                        requireClose()
                    }
                }

                "tan" -> {
                    requireOpen()
                    tan(Math.toRadians(expression())).also {
                        requireClose()
                    }
                }

                "ln" -> {
                    requireOpen()
                    kotlin.math.ln(expression()).also {
                        requireClose()
                    }
                }

                "log" -> {
                    requireOpen()
                    log10(expression()).also {
                        requireClose()
                    }
                }

                "abs" -> {
                    requireOpen()
                    abs(expression()).also {
                        requireClose()
                    }
                }

                else -> throw IllegalArgumentException("Unknown function: $name")
            }
        }

        throw IllegalArgumentException("Invalid expression")
    }

    private fun number(): Double {

        val start = position

        while (
            position < input.length &&
            (
                input[position].isDigit() ||
                    input[position] == '.' ||
                    input[position] == 'E' ||
                    input[position] == 'e'
                )
        ) {
            position++
        }

        return input.substring(start, position).toDouble()
    }

    private fun identifier(): String {

        val start = position

        while (
            position < input.length &&
            input[position].isLetter()
        ) {
            position++
        }

        return input.substring(start, position)
    }

    private fun requireOpen() {
        skipSpaces()
        if (!match('(')) {
            throw IllegalArgumentException("Missing (")
        }
    }

    private fun requireClose() {
        skipSpaces()
        if (!match(')')) {
            throw IllegalArgumentException("Missing )")
        }
    }

    private fun match(c: Char): Boolean {
        if (position < input.length && input[position] == c) {
            position++
            return true
        }
        return false
    }

    private fun skipSpaces() {
        while (position < input.length && input[position].isWhitespace()) {
            position++
        }
    }
}

private fun calculateExpression(expression: String): String {

    if (expression.isBlank()) return "0"

    return try {
        val result = ExpressionParser(expression).parse()

        if (result.isNaN() || result.isInfinite()) {
            "Error"
        } else {
            formatNumber(result)
        }
    } catch (_: Exception) {
        "Error"
    }
}

private fun formatNumber(value: Double): String {

    if (abs(value) < 0.0000000001) return "0"

    val rounded = if (abs(value - value.toLong()) < 0.0000000001) {
        value.toLong().toDouble()
    } else value

    val formatter = DecimalFormat("#,##0.##########")

    return formatter.format(rounded)
}

private fun cleanExpressionForParser(value: String): String {
    return value
        .replace("×", "*")
        .replace("÷", "/")
        .replace("−", "-")
        .replace("π", "pi")
        .replace("√", "sqrt")
}

// ============================================================
// TAMIL DATE / TIME
// ============================================================

private fun tamilDay(day: Int): String =
    listOf(
        "ஞாயிறு",
        "திங்கள்",
        "செவ்வாய்",
        "புதன்",
        "வியாழன்",
        "வெள்ளி",
        "சனி"
    )[day]

private fun tamilMonth(month: Int): String =
    listOf(
        "ஜனவரி",
        "பிப்ரவரி",
        "மார்ச்",
        "ஏப்ரல்",
        "மே",
        "ஜூன்",
        "ஜூலை",
        "ஆகஸ்ட்",
        "செப்டம்பர்",
        "அக்டோபர்",
        "நவம்பர்",
        "டிசம்பர்"
    )[month - 1]

private fun tamilDateTime(): String {

    val now = LocalDateTime.now()

    val day = tamilDay(now.dayOfWeek.value % 7)
    val month = tamilMonth(now.monthValue)

    val time =
        String.format(
            Locale.getDefault(),
            "%02d:%02d:%02d",
            now.hour,
            now.minute,
            now.second
        )

    return "$day, ${now.dayOfMonth} $month ${now.year} • $time"
}

