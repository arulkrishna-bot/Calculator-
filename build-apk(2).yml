                            shareText(
                                "$expression = $result"
                            )
                        },
                        onScreenshot = {
                            makeScreenshot(
                                expression,
                                result
                            )
                        }
                    )
                }

                Page.HISTORY -> {

                    HistoryScreen(
                        padding = padding,
                        history = history,
                        onItemClick = { item ->
                            expression = item.expression
                            result = item.result
                            page = Page.CALCULATOR
                        },
                        onClear = {
                            history.clear()
                            store.clearHistory()
                        },
                        onShare = {
                            shareText(
                                "${it.expression} = ${it.result}"
                            )
                        }
                    )
                }

                Page.CONVERTER -> {

                    ConverterScreen(
                        padding = padding,
                        type = converterType,
                        onTypeChange = {
                            converterType = it
                        },
                        darkMode = darkMode
                    )
                }

                Page.SETTINGS -> {

                    SettingsScreen(
                        padding = padding,
                        darkMode = darkMode,
                        wallpaper = wallpaper,
                        onDarkModeChange = onDarkModeChanged,
                        onPickWallpaper = {
                            wallpaperPicker.launch("image/*")
                        },
                        onRemoveWallpaper = {
                            wallpaper = null
                            store.saveWallpaper(null)
                        }
                    )
                }
            }
        }
    }
}

// ============================================================
// CALCULATOR SCREEN
// ============================================================

@Composable
private fun CalculatorScreen(
    padding: PaddingValues,
    expression: String,
    result: String,
    scientific: Boolean,
    memory: Float,
    darkMode: Boolean,
    onExpressionChange: (String) -> Unit,
    onResultChange: (String) -> Unit,
    onScientificChange: (Boolean) -> Unit,
    onMemoryChange: (Float) -> Unit,
    onAddHistory: () -> Unit,
    onVibrate: () -> Unit,
    onShare: () -> Unit,
    onScreenshot: () -> Unit
) {

    Column(
        modifier = Modifier
            .fillMaxSize()
            .padding(padding)
            .padding(horizontal = 12.dp)
    ) {

        // DISPLAY

        Card(
            modifier = Modifier
                .fillMaxWidth()
                .padding(top = 8.dp),
            shape = RoundedCornerShape(24.dp),
            colors = CardDefaults.cardColors(
                containerColor =
                    if (darkMode) DarkCard
                    else LightCard
            )
        ) {

            Column(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(20.dp),
                horizontalAlignment = Alignment.End
            ) {

                Text(
                    text =
                        if (expression.isBlank())
                            "Ready"
                        else expression,
                    fontSize = 22.sp,
                    color = Color.Gray,
                    maxLines = 2
                )

                Spacer(
                    Modifier.height(8.dp)
                )

                Text(
                    text = result,
                    fontSize = 46.sp,
                    fontWeight = FontWeight.Bold,
                    color = Blue,
                    maxLines = 2
                )

                Spacer(
                    Modifier.height(8.dp)
                )

                Row {

                    Text(
                        "M: ${formatNumber(memory.toDouble())}",
                        fontSize = 12.sp,
                        color = Color.Gray
                    )

                    Spacer(
                        Modifier.width(14.dp)
                    )

                    Text(
                        tamilDateTime(),
                        fontSize = 11.sp,
                        color = Color.Gray
                    )
                }
            }
        }

        Spacer(
            Modifier.height(8.dp)
        )

        Row(
            modifier = Modifier
                .fillMaxWidth()
                .horizontalScroll(
                    rememberScrollState()
                ),
            horizontalArrangement = Arrangement.spacedBy(6.dp)
        ) {

            SmallButton(
                "MC",
                onClick = {
                    onMemoryChange(0f)
                    onVibrate()
                }
            )

            SmallButton(
                "MR",
                onClick = {
                    val m =
                        formatNumber(memory.toDouble())
                    onExpressionChange(
                        if (expression.isBlank())
                            m
                        else expression + m
                    )
                    onVibrate()
                }
            )

            SmallButton(
                "M+",
                onClick = {
                    val v =
                        result.replace(",", "").toFloatOrNull()
                            ?: 0f
                    onMemoryChange(
                        memory + v
                    )
                    onVibrate()
                }
            )

            SmallButton(
                "M−",
                onClick = {
                    val v =
                        result.replace(",", "").toFloatOrNull()
                            ?: 0f
                    onMemoryChange(
                        memory - v
                    )
                    onVibrate()
                }
            )

            SmallButton(
                "SCI",
                onClick = {
                    onScientificChange(!scientific)
                }
            )

            SmallButton(
                "📤",
                onClick = onShare
            )

            SmallButton(
                "📸",
                onClick = onScreenshot
            )
        }

        Spacer(
            Modifier.height(6.dp)
        )

        if (scientific) {

            ScientificRow(
                onClick = { key ->

                    onVibrate()

                    when (key) {

                        "sin" -> appendFunction(
                            expression,
                            "sin(",
                            onExpressionChange
                        )

                        "cos" -> appendFunction(
                            expression,
                            "cos(",
                            onExpressionChange
                        )

                        "tan" -> appendFunction(
                            expression,
                            "tan(",
                            onExpressionChange
                        )

                        "ln" -> appendFunction(
                            expression,
                            "ln(",
                            onExpressionChange
                        )

                        "log" -> appendFunction(
                            expression,
                            "log(",
                            onExpressionChange
                        )

                        "√" -> appendFunction(
                            expression,
                            "sqrt(",
                            onExpressionChange
                        )

                        "π" -> appendFunction(
                            expression,
                            "pi",
                            onExpressionChange
                        )

                        "e" -> appendFunction(
                            expression,
                            "e",
                            onExpressionChange
                        )

                        "^" -> appendFunction(
                            expression,
                            "^",
                            onExpressionChange
                        )

                        "(" -> appendFunction(
                            expression,
                            "(",
                            onExpressionChange
                        )

                        ")" -> appendFunction(
                            expression,
                            ")",
                            onExpressionChange
                        )
                    }
                }
            )

            Spacer(
                Modifier.height(6.dp)
            )
        }

        // BUTTONS

        val rows = listOf(

            listOf(
                "C",
                "⌫",
                "%",
                "÷"
            ),

            listOf(
                "7",
                "8",
                "9",
                "×"
            ),

            listOf(
                "4",
                "5",
                "6",
                "−"
            ),

            listOf(
                "1",
                "2",
                "3",
                "+"
            ),

            listOf(
                "00",
                "0",
                ".",
                "="
            )
        )

        rows.forEach { row ->

            Row(
                modifier = Modifier
                    .fillMaxWidth()
                    .weight(1f),
                horizontalArrangement =
                    Arrangement.spacedBy(7.dp)
            ) {

                row.forEach { key ->

                    CalculatorButton(
                        key = key,
                        modifier = Modifier.weight(1f),
                        isOperator =
                            key in listOf(
                                "÷",
                                "×",
                                "−",
                                "+",
                                "="
                            ),
                        isClear = key == "C",
                        onClick = {

                            onVibrate()

                            when (key) {

                                "C" -> {
                                    onExpressionChange("")
                                    onResultChange("0")
                                }

                                "⌫" -> {

                                    if (expression.isNotEmpty()) {

                                        onExpressionChange(
                                            expression.dropLast(1)
                                        )

                                        val newExp =
                                            expression.dropLast(1)

                                        if (newExp.isNotBlank()) {
                                            onResultChange(
                                                calculateExpression(
                                                    cleanExpressionForParser(
                                                        newExp
                                                    )
                                                )
                                            )
                                        } else {
                                            onResultChange("0")
                                        }
                                    }
                                }

                                "=" -> {

                                    val answer =
                                        calculateExpression(
                                            cleanExpressionForParser(
                                                expression
                                            )
                                        )

                                    onResultChange(answer)
                                    onAddHistory()
                                }

                                else -> {

                                    val newExpression =
                                        expression + key

                                    onExpressionChange(
                                        newExpression
                                    )

                                    val preview =
                                        calculateExpression(
                                            cleanExpressionForParser(
                                                newExpression
                                            )
                                        )

                                    if (preview != "Error") {
                                        onResultChange(preview)
                                    }
                                }
                            }
                        }
                    )
                }
            }
        }
    }
}

private fun appendFunction(
    expression: String,
    value: String,
    onChange: (String) -> Unit
) {
    onChange(
        if (expression.isBlank())
            value
        else expression + value
    )
}

