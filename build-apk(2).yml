@Composable
private fun CalculatorButton(
    key: String,
    modifier: Modifier,
    isOperator: Boolean,
    isClear: Boolean,
    onClick: () -> Unit
) {

    val background = when {

        isClear ->
            Red

        isOperator ->
            Blue

        else ->
            DarkButton
    }

    Box(
        modifier = modifier
            .fillMaxHeight()
            .clip(
                RoundedCornerShape(20.dp)
            )
            .background(background)
            .clickable {
                onClick()
            }
            .border(
                1.dp,
                Color.White.copy(alpha = 0.05f),
                RoundedCornerShape(20.dp)
            ),
        contentAlignment = Alignment.Center
    ) {

        Text(
            key,
            fontSize =
                if (key.length > 1)
                    20.sp
                else
                    28.sp,
            fontWeight = FontWeight.Bold,
            color = Color.White
        )
    }
}

