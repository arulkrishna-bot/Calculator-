name: Build BlueCalc APK
on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p .
          echo '' | base64 -d > 'settings.gradle'
          mkdir -p .
          echo 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC42LjEnIGFwcGx5IGZhbHNlIH0=' | base64 -d > 'build.gradle'
          mkdir -p .
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVl' | base64 -d > 'gradle.properties'
          mkdir -p 'app'
          echo 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgfQphbmRyb2lkIHsgbmFtZXNwYWNlICdjb20uZXhhbXBsZS5ibHVlY2FsYyc7IGNvbXBpbGVTZGsgMzUKZGVmYXVsdENvbmZpZyB7IGFwcGxpY2F0aW9uSWQgJ2NvbS5leGFtcGxlLmJsdWVjYWxjJzsgbWluU2RrIDIzOyB0YXJnZXRTZGsgMzU7IHZlcnNpb25Db2RlIDE7IHZlcnNpb25OYW1lICcxLjAnIH0KfQ==' | base64 -d > 'app/build.gradle'
          mkdir -p 'app/src/main'
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p 'app/src/main/res/values'
          echo '' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p 'app/src/main/java/com/example/bluecalc'
          echo '' | base64 -d > 'app/src/main/java/com/example/bluecalc/MainActivity.java'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueCalc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
