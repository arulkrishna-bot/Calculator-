@Composable
private fun BlueBlackCalculatorApp() {

    val context = LocalContext.current
    val store = remember { CalculatorStore(context) }

    var darkMode by remember {
        mutableStateOf(store.darkMode())
    }

    val wallpaperUri by remember {
        mutableStateOf(store.wallpaper())
    }

    val colors = if (darkMode) {

        darkColorScheme(
            primary = Blue,
            secondary = DeepBlue,
            background = Black,
            surface = DarkCard,
            onBackground = Color.White,
            onSurface = Color.White
        )

    } else {

        lightColorScheme(
            primary = DeepBlue,
            secondary = Blue,
            background = LightBg,
            surface = LightCard,
            onBackground = Color.Black,
            onSurface = Color.Black
        )
    }

    MaterialTheme(
        colorScheme = colors
    ) {

        CalculatorAppContent(
            darkMode = darkMode,
            wallpaperUri = wallpaperUri,
            onDarkModeChanged = {
                darkMode = it
                store.saveDarkMode(it)
            }
        )
    }
}

