// ============================================================
// CURRENCY
// ============================================================

@Composable
private fun CurrencyConverter() {

    var amount by remember {
        mutableStateOf("1")
    }

    var from by remember {
        mutableStateOf("INR")
    }

    var to by remember {
        mutableStateOf("USD")
    }

    val rates = mapOf(
        "INR" to 1.0,
        "USD" to 0.0119,
        "EUR" to 0.0109,
        "GBP" to 0.0094,
        "AED" to 0.0437,
        "SGD" to 0.0156,
        "JPY" to 1.77,
        "AUD" to 0.0180,
        "CAD" to 0.0164
    )

    val result = convertCurrency(
        amount.toDoubleOrNull() ?: 0.0,
        from,
        to,
        rates
    )

    ConverterCard("Currency Converter") {

        NumberField(
            amount,
            {
                amount = it
            },
            "Amount"
        )

        Spacer(
            Modifier.height(10.dp)
        )

        UnitRow(
            from,
            rates.keys.toList()
        ) {
            from = it
        }

        Text(
            "⇅",
            modifier = Modifier
                .fillMaxWidth()
                .padding(8.dp),
            color = Blue,
            fontSize = 28.sp,
            textAlign = androidx.compose.ui.text.style.TextAlign.Center
        )

        UnitRow(
            to,
            rates.keys.toList()
        ) {
            to = it
        }

        ResultText(
            "${formatNumber(result)} $to"
        )

        Text(
            "Demo rates. Update rates when required.",
            color = Color.Gray,
            fontSize = 11.sp
        )
    }
}

private fun convertCurrency(
    value: Double,
    from: String,
    to: String,
    rates: Map<String, Double>
): Double {

    val inr = value / (rates[from] ?: 1.0)
    return inr * (rates[to] ?: 1.0)
}

