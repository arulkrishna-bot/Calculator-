// ============================================================
// TEMPERATURE
// ============================================================

@Composable
private fun TemperatureConverter() {

    var value by remember {
        mutableStateOf("25")
    }

    var from by remember {
        mutableStateOf("Celsius")
    }

    var to by remember {
        mutableStateOf("Fahrenheit")
    }

    val input =
        value.toDoubleOrNull() ?: 0.0

    val celsius =
        when (from) {

            "Celsius" -> input

            "Fahrenheit" ->
                (input - 32) * 5 / 9

            "Kelvin" ->
                input - 273.15

            else -> input
        }

    val result =
        when (to) {

            "Celsius" -> celsius

            "Fahrenheit" ->
                celsius * 9 / 5 + 32

            "Kelvin" ->
                celsius + 273.15

            else -> celsius
        }

    ConverterCard("Temperature Converter") {

        NumberField(
            value,
            { value = it },
            "Temperature"
        )

        Spacer(Modifier.height(10.dp))

        UnitRow(
            from,
            listOf(
                "Celsius",
                "Fahrenheit",
                "Kelvin"
            )
        ) {
            from = it
        }

        Spacer(Modifier.height(10.dp))

        UnitRow(
            to,
            listOf(
                "Celsius",
                "Fahrenheit",
                "Kelvin"
            )
        ) {
            to = it
        }

        ResultText(
            formatNumber(result)
        )
    }
}

// ============================================================
// GST
// ============================================================

@Composable
private fun GstConverter() {

    var amount by remember {
        mutableStateOf("1000")
    }

    var gst by remember {
        mutableStateOf("18")
    }

    val a = amount.toDoubleOrNull() ?: 0.0
    val g = gst.toDoubleOrNull() ?: 0.0

    val gstAmount =
        a * g / 100

    val total =
        a + gstAmount

    val baseFromInclusive =
        a * 100 / (100 + g)

    val gstFromInclusive =
        a - baseFromInclusive

    ConverterCard("GST Calculator") {

        NumberField(
            amount,
            { amount = it },
            "Amount"
        )

        Spacer(Modifier.height(8.dp))

        NumberField(
            gst,
            { gst = it },
            "GST %"
        )

        ResultText(
            "GST Amount: ₹${formatNumber(gstAmount)}"
        )

        Text(
            "Total: ₹${formatNumber(total)}",
            color = Green,
            fontSize = 24.sp,
            fontWeight = FontWeight.Bold
        )

        Divider(
            Modifier.padding(vertical = 14.dp)
        )

        Text(
            "If amount includes GST:",
            color = Color.Gray
        )

        Text(
            "Base: ₹${formatNumber(baseFromInclusive)}",
            color = Color.White
        )

        Text(
            "GST: ₹${formatNumber(gstFromInclusive)}",
            color = Blue
        )
    }
}

// ============================================================
// BMI
// ============================================================

@Composable
private fun BmiConverter() {

    var weight by remember {
        mutableStateOf("70")
    }

    var height by remember {
        mutableStateOf("170")
    }

    val w =
        weight.toDoubleOrNull() ?: 0.0

    val h =
        height.toDoubleOrNull() ?: 0.0

    val bmi =
        if (h > 0)
            w / (h / 100).pow(2)
        else
            0.0

    val category =
        when {

            bmi <= 0 -> "Enter valid values"

            bmi < 18.5 ->
                "Underweight"

            bmi < 25 ->
                "Normal"

            bmi < 30 ->
                "Overweight"

            else ->
                "Obesity"
        }

    ConverterCard("BMI Calculator") {

        NumberField(
            weight,
            { weight = it },
            "Weight (kg)"
        )

        Spacer(Modifier.height(8.dp))

        NumberField(
            height,
            { height = it },
            "Height (cm)"
        )

        ResultText(
            "BMI: ${formatNumber(bmi)}"
        )

        Text(
            category,
            color =
                if (category == "Normal")
                    Green
                else
                    Orange,
            fontSize = 20.sp,
            fontWeight = FontWeight.Bold
        )
    }
}

