// ============================================================
// FINANCE
// ============================================================

@Composable
private fun FinanceConverter() {

    var principal by remember {
        mutableStateOf("100000")
    }

    var rate by remember {
        mutableStateOf("8")
    }

    var years by remember {
        mutableStateOf("5")
    }

    val p = principal.toDoubleOrNull() ?: 0.0
    val r = rate.toDoubleOrNull() ?: 0.0
    val t = years.toDoubleOrNull() ?: 0.0

    val simpleInterest =
        p * r * t / 100.0

    val compound =
        p * (1 + r / 100).pow(t) - p

    ConverterCard("Finance Calculator") {

        NumberField(
            principal,
            { principal = it },
            "Principal"
        )

        Spacer(Modifier.height(8.dp))

        NumberField(
            rate,
            { rate = it },
            "Annual Interest %"
        )

        Spacer(Modifier.height(8.dp))

        NumberField(
            years,
            { years = it },
            "Years"
        )

        ResultText(
            "Simple Interest: ₹${formatNumber(simpleInterest)}"
        )

        Text(
            "Compound Interest: ₹${formatNumber(compound)}",
            color = Green,
            fontSize = 18.sp
        )

        Text(
            "Simple Amount: ₹${formatNumber(p + simpleInterest)}",
            color = Color.White
        )

        Text(
            "Compound Amount: ₹${formatNumber(p + compound)}",
            color = Color.White
        )
    }
}

