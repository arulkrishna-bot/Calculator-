@OptIn(ExperimentalMaterial3Api::class)
@Composable
private fun CalculatorAppContent(
    darkMode: Boolean,
    wallpaperUri: String?,
    onDarkModeChanged: (Boolean) -> Unit
) {

    val context = LocalContext.current
    val store = remember { CalculatorStore(context) }

    var page by remember {
        mutableStateOf(Page.CALCULATOR)
    }

    var expression by remember {
        mutableStateOf("")
    }

    var result by remember {
        mutableStateOf("0")
    }

    var scientific by remember {
        mutableStateOf(false)
    }

    var memory by remember {
        mutableFloatStateOf(0f)
    }

    val history = remember {
        mutableStateListOf<HistoryItem>().apply {
            addAll(store.loadHistory())
        }
    }

    var converterType by remember {
        mutableStateOf(ConverterType.CURRENCY)
    }

    var showMenu by remember {
        mutableStateOf(false)
    }

    var wallpaper by remember {
        mutableStateOf(wallpaperUri)
    }

    val wallpaperPicker =
        rememberLauncherForActivityResult(
            ActivityResultContracts.GetContent()
        ) { uri: Uri? ->

            if (uri != null) {
                wallpaper = uri.toString()
                store.saveWallpaper(uri.toString())
            }
        }

    val doVibrate = {
        try {
            val vibrator =
                if (android.os.Build.VERSION.SDK_INT >= 31) {
                    val manager =
                        context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE)
                            as VibratorManager
                    manager.defaultVibrator
                } else {
                    @Suppress("DEPRECATION")
                    context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                }

            if (android.os.Build.VERSION.SDK_INT >= 26) {
                vibrator.vibrate(
                    VibrationEffect.createOneShot(
                        20,
                        VibrationEffect.DEFAULT_AMPLITUDE
                    )
                )
            }
        } catch (_: Exception) {
        }
    }

    fun addHistory(exp: String, res: String) {

        if (exp.isBlank() || res == "Error") return

        history.add(
            0,
            HistoryItem(
                exp,
                res,
                SimpleDateFormat(
                    "dd/MM/yyyy HH:mm",
                    Locale.getDefault()
                ).format(Date())
            )
        )

        while (history.size > 100) {
            history.removeAt(history.lastIndex)
        }

        store.saveHistory(history)
    }

    fun shareText(text: String) {

        val intent = Intent(Intent.ACTION_SEND).apply {
            type = "text/plain"
            putExtra(Intent.EXTRA_TEXT, text)
        }

        context.startActivity(
            Intent.createChooser(intent, "Share calculation")
        )
    }

    fun makeScreenshot(exp: String, res: String) {

        val width = 1080
        val height = 620

        val bitmap =
            Bitmap.createBitmap(
                width,
                height,
                Bitmap.Config.ARGB_8888
            )

        val canvas = Canvas(bitmap)

        canvas.drawColor(
            if (darkMode) Black.toArgb()
            else LightBg.toArgb()
        )

        val paint = Paint(Paint.ANTI_ALIAS_FLAG)

        paint.color = Blue.toArgb()
        paint.typeface = Typeface.DEFAULT_BOLD
        paint.textSize = 58f

        canvas.drawText(
            "BLUE BLACK CALCULATOR",
            60f,
            100f,
            paint
        )

        paint.color =
            if (darkMode) Color.WHITE.toArgb()
            else Color.BLACK.toArgb()

        paint.typeface = Typeface.DEFAULT
        paint.textSize = 44f

        canvas.drawText(
            exp,
            60f,
            210f,
            paint
        )

        paint.color = Blue.toArgb()
        paint.textSize = 72f
        paint.typeface = Typeface.DEFAULT_BOLD

        canvas.drawText(
            "= $res",
            60f,
            330f,
            paint
        )

        paint.color =
            if (darkMode) Color.LTGRAY.toArgb()
            else Color.DKGRAY.toArgb()

        paint.textSize = 32f
        paint.typeface = Typeface.DEFAULT

        canvas.drawText(
            tamilDateTime(),
            60f,
            450f,
            paint
        )

        canvas.drawText(
            "Created with Blue Black Calculator",
            60f,
            520f,
            paint
        )

        try {

            val file =
                File(
                    context.cacheDir,
                    "calculator_${System.currentTimeMillis()}.png"
                )

            FileOutputStream(file).use {
                bitmap.compress(
                    Bitmap.CompressFormat.PNG,
                    100,
                    it
                )
            }

            val uri =
                androidx.core.content.FileProvider.getUriForFile(
                    context,
                    "${context.packageName}.fileprovider",
                    file
                )

            val shareIntent =
                Intent(Intent.ACTION_SEND).apply {
                    type = "image/png"
                    putExtra(Intent.EXTRA_STREAM, uri)
                    addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                }

            context.startActivity(
                Intent.createChooser(
                    shareIntent,
                    "Share screenshot"
                )
            )

        } catch (_: Exception) {

            shareText("$exp = $res")
        }
    }

    Scaffold(

        topBar = {

            TopAppBar(

                title = {
                    Column {

                        Text(
                            "Blue Black",
                            fontWeight = FontWeight.Bold
                        )

                        Text(
                            tamilDateTime(),
                            fontSize = 10.sp
                        )
                    }
                },

                navigationIcon = {

                    IconButton(
                        onClick = {
                            page = Page.CALCULATOR
                        }
                    ) {

                        Icon(
                            Icons.Default.Calculate,
                            contentDescription = null
                        )
                    }
                },

                actions = {

                    IconButton(
                        onClick = {
                            shareText(
                                if (expression.isNotBlank())
                                    "$expression = $result"
                                else
                                    "Blue Black Calculator"
                            )
                        }
                    ) {

                        Icon(
                            Icons.Default.Share,
                            contentDescription = "Share"
                        )
                    }

                    IconButton(
                        onClick = {
                            showMenu = true
                        }
                    ) {

                        Icon(
                            Icons.Default.MoreVert,
                            contentDescription = null
                        )
                    }

                    DropdownMenu(
                        expanded = showMenu,
                        onDismissRequest = {
                            showMenu = false
                        }
                    ) {

                        DropdownMenuItem(
                            text = {
                                Text("Scientific calculator")
                            },
                            onClick = {
                                scientific = !scientific
                                showMenu = false
                            }
                        )

                        DropdownMenuItem(
                            text = {
                                Text("Clear history")
                            },
                            onClick = {
                                history.clear()
                                store.clearHistory()
                                showMenu = false
                            }
                        )
                    }
                }
            )
        },

        bottomBar = {

            NavigationBar(
                modifier = Modifier.navigationBarsPadding()
            ) {

                NavigationBarItem(
                    selected = page == Page.CALCULATOR,
                    onClick = {
                        page = Page.CALCULATOR
                    },
                    icon = {
                        Icon(
                            Icons.Default.Calculate,
                            contentDescription = null
                        )
                    },
                    label = {
                        Text("Calculator")
                    }
                )

                NavigationBarItem(
                    selected = page == Page.HISTORY,
                    onClick = {
                        page = Page.HISTORY
                    },
                    icon = {
                        Icon(
                            Icons.Default.History,
                            contentDescription = null
                        )
                    },
                    label = {
                        Text("History")
                    }
                )

                NavigationBarItem(
                    selected = page == Page.CONVERTER,
                    onClick = {
                        page = Page.CONVERTER
                    },
                    icon = {
                        Icon(
                            Icons.Default.SwapHoriz,
                            contentDescription = null
                        )
                    },
                    label = {
                        Text("Convert")
                    }
                )

                NavigationBarItem(
                    selected = page == Page.SETTINGS,
                    onClick = {
                        page = Page.SETTINGS
                    },
                    icon = {
                        Icon(
                            Icons.Default.Settings,
                            contentDescription = null
                        )
                    },
                    label = {
                        Text("Settings")
                    }
                )
            }
        }

    ) { padding ->

        Box(
            modifier = Modifier
                .fillMaxSize()
                .background(
                    if (darkMode) Black else LightBg
                )
        ) {

            if (wallpaper != null) {

                // Wallpaper URI is intentionally stored.
                // App remains usable if provider temporarily cannot load it.
                Text(
                    "",
                    modifier = Modifier.size(0.dp)
                )
            }

            when (page) {

                Page.CALCULATOR -> {

                    CalculatorScreen(
                        padding = padding,
                        expression = expression,
                        result = result,
                        scientific = scientific,
                        memory = memory,
                        darkMode = darkMode,
                        onExpressionChange = {
                            expression = it
                        },
                        onResultChange = {
                            result = it
                        },
                        onScientificChange = {
                            scientific = it
                        },
                        onMemoryChange = {
                            memory = it
